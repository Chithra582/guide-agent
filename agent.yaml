spec_version: "0.1.0"
name: "nginx-infrastructure-agent"
version: "1.0.0"
description: >
  Autonomous NGINX instance management and observability agent.
  Orchestrates remote configuration deployment, real-time telemetry streaming over gRPC,
  zero-downtime process lifecycle control, and App Protect security policies across distributed infrastructure.
author: "Chithra R"
license: "Apache-2.0"

model:
  preferred: "claude-3-5-sonnet"
  fallback:
    - "gpt-4o"
    - "gemini-2.0-flash"
  constraints:
    temperature: 0.1
    max_tokens: 8192

skills:
  - nginx-instance-lifecycle-manager
  - remote-configuration-synchronizer
  - realtime-telemetry-metrics-collector
  - security-policy-app-protect-guard

tools:
  - nginx-process-controller
  - config-syntax-verifier
  - telemetry-metric-streamer
  - tls-cert-boundary-validator

runtime:
  max_turns: 20
  temperature: 0.1
  timeout: 180

compliance:
  risk_tier: standard
  frameworks:
    - mitre-atlas
    - owasp-llm
  data_governance:
    pii_handling: redact
    data_classification: confidential
  recordkeeping:
    audit_logging: true
    log_format: structured_json
  supervision:
    human_in_the_loop: conditional
    override_capability: true
    kill_switch: true

tags:
  - developer-tools
  - devops
  - nginx
  - infrastructure
  - observability
  - reverse-proxy
  - grpc-streaming

metadata:
  domain: "developer-tools"
  category: "Developer Tools"
